---
layout: null
permalink: /premodern/format/
---
<html data-theme="light">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Consolas|Montserrat:100,300,600">
    <link rel="stylesheet" href="https://nickmuse.github.io/muse.css/muse.css">
    <title>What is Premodern?</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: flex-start;
            align-items: center;
        }
        .set-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 8px;
            padding: 0px 40px 0px 40px;
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }
        .set-item {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.3s;
            position: relative;
            height: 80px;
            overflow: visible;
        }
        .set-item img { width: 50px; height: 50px; display: block; margin: auto; }
        [data-theme="dark"] .set-item img { filter: invert(1); }
        .set-item .year {
            position: absolute;
            top: -3px;
            right: -3px;
            color: var(--col-text-code);
            font-size: 12px;
            font-weight: bold;
            background: var(--col-body-bg-next);
            padding: 2px 5px;
            border-radius: 3px;
            z-index: 1;
        }
        .format-key-oldschool {background: color-mix(in srgb, var(--red) 70%, var(--col-body-bg)); }
        .format-key-premodern { background: color-mix(in srgb, var(--green) 70%, var(--col-body-bg)); }
        .format-key-modern { background: color-mix(in srgb, var(--blue) 70%, var(--col-body-bg)); }
        .format-key-starter { background: color-mix(in srgb, var(--yellow) 70%, var(--col-body-bg)); }
        .format-label {
            position: absolute;
            left: -80px;
            top: 46px;
            font-size: 14px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
            width: 100px;
            text-align: center;
            transform: rotate(90deg);
            transform-origin: center center;
        }

    </style>
</head>
<body class="theme animate__bounceIn">
    <div class="navigation">
        <div class="nav-left"><a href="/premodern/">↩ Battlebox</a></div>
        <div class="nav-right"><label class="switch"><input name="toggle_dark" type="checkbox"><span class="slider"></span></label></div>
    </div>
    <div class="page-content">
        <div class="page">
            <!-- Description -->
            <h1>Premodern</h1>
            <p>Plays tournament-legal sets from '95 until the card frame change*.</p>
            <br>
            <!-- Set Type Filters -->
            <div class="filters" id="set-type-filters">
                <label class="switch"><input type="checkbox" value="starter"><span class="slider"></span></label>
                <span><h2>Show Starter Sets</h2></span>
            </div>

            <!-- Set Icons Grid -->
            <div class="set-grid" id="set-grid"></div>
            <script>
                const formats = {
                    "modern": { 
                        name: "Modern ➤",
                        start: "2003-07-28", 
                        end: null, 
                        set_types: ["core", "expansion", "masters"], 
                        injected_sets: ["MH2", "H1R", "H2R", "MH3"]  
                    },
                    "premodern": { 
                        name: "Premodern",
                        start: "1995-04-01", 
                        end: "2003-05-26", 
                        set_types: ["core", "expansion", "masters", "commander"], 
                        injected_sets: []  
                    },
                    "oldschool": { 
                        name: "Old School",
                        start: "1993-01-01", 
                        end: "1995-01-01", 
                        set_types: ["core", "expansion"], 
                        injected_sets: []  
                    }
                };
            
                let allSets = [];
                const excludedCodes = ["4BB","SUM"]; // Hardcoded list of excluded set codes
            
                async function fetchSets() {
                    let response = await fetch("https://api.scryfall.com/sets");
                    let data = await response.json();
                    allSets = data.data.reverse();
                    // Include sets up to 2009 with fade effect at bottom
                    allSets = allSets.filter(set => set.released_at <= "2007-06-01");
                    updateGrid();
                }
            
                function updateGrid() {
                    let selectedFormats = ['oldschool', 'premodern', 'modern'];
                    let selectedSetTypes = ['core', 'expansion'];
                    if ($("#set-type-filters input:checked").length > 0) {
                        selectedSetTypes.push('starter');
                    }
                    let grid = $("#set-grid").empty();
                    let previousYear = null;
                    let formatFirstRow = {}; // Track first full row for each format
                    let currentColumn = 0;
                    const columnsPerRow = 6;
                
                    allSets.forEach(set => {
                        if (excludedCodes.includes(set.code.toUpperCase())) return; // Skip excluded sets by code
                        if (!selectedSetTypes.includes(set.set_type)) return;
                    
                        let bgClass = selectedFormats.map(format => {
                            let rule = formats[format];
                            let releaseDate = set.released_at;
                            let isInjectedSet = rule.injected_sets.includes(set.code);
                        
                            if ((releaseDate >= rule.start && (!rule.end || releaseDate <= rule.end)) || isInjectedSet) {
                                if (rule.set_types.includes(set.set_type)) {
                                    return `format-key-${format}`;
                                }
                            }
                            return '';
                        }).join(' ');
                        
                        // Add starter class if it's a starter set
                        if (set.set_type === 'starter') {
                            bgClass += ' format-key-starter';
                        }
                    
                        let releaseYear = new Date(set.released_at).getFullYear();
                        let yearLabel = '';
                        if (releaseYear !== previousYear) {
                            yearLabel = `<div class="year">'${String(releaseYear).slice(-2)}</div>`;
                            previousYear = releaseYear;
                        }
                        
                        // Add asterisk marker box to Eighth Edition
                        let asteriskLabel = '';
                        if (set.code.toUpperCase() === '8ED') {
                            asteriskLabel = `<div class="year">*</div>`;
                        }
                    
                        // Check if we're at the start of a row for format label (where a key will be placed)
                        let formatLabel = '';
                        let primaryFormat = bgClass.split(' ').find(c => c.startsWith('format-key-') && c !== 'format-key-starter');
                        if (primaryFormat && currentColumn === 0 && !formatFirstRow[primaryFormat]) {
                            formatFirstRow[primaryFormat] = true;
                            let formatName = primaryFormat.replace('format-key-', '');
                            formatLabel = `<div class="format-label ${primaryFormat}">${formats[formatName].name}</div>`;
                        }
                        
                        // Append set item to grid with format label, year label, and asterisk label if applicable
                        grid.append(`
                            <div class="set-item ${bgClass}">
                                ${formatLabel}
                                ${yearLabel}
                                ${asteriskLabel}
                                <img src="${set.icon_svg_uri}" alt="${set.name}" title="${set.name}">
                                <div>${set.name}</div>
                            </div>
                        `);
                        
                        // Update column count and reset format label tracking at the end of each row
                        currentColumn = (currentColumn + 1) % columnsPerRow;
                    });
                }
            
                $("#set-type-filters").on("change", updateGrid);
                fetchSets();
            </script>
        </div>
        <script type="text/javascript" src="https://nickmuse.github.io/muse.css/toggle_dark.js"></script>
    </body>
</html>
