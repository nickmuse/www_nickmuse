---
layout: null
permalink: /premodern/
---
<html data-theme="light">
    <head>
        <title>Premodern Battlebox</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Consolas|Montserrat:100,300,600">
        <link rel="stylesheet" href="https://nickmuse.github.io/muse.css/muse.css">
    </head>
    <body class="theme animate__bounceIn">
        <div class="navigation">
            <div class="nav-left"><a href="/premodern/format/">What is Premodern?</a></div>
            <div class="nav-right"><label class="switch"><input name="toggle_dark" type="checkbox"><span class="slider"></span></label></div>
        </div>
        <div class="page-content">
            <div class="page">
                <div class="article">
                    <style>
                        .mana-symbol {
                            height: 18px;
                            vertical-align: middle;
                            
                        }

                        .deck-selector {
                            display: flex;
                            flex-wrap: wrap;
                            gap: 20px;
                            justify-content: center;
                            margin: 0 auto;
                        }
                        .deck-cover {
                            flex: 1 1 calc(50% - 10px);
                            max-width: calc(50% - 10px);
                            border-radius: 5px;
                            overflow: hidden;
                            cursor: pointer;
                            transition: transform 0.2s, box-shadow 0.2s;
                            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                        }
                        .deck-cover:hover {
                            transform: translateY(-5px);
                            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
                        }
                        .deck-cover img {
                            width: 100%;
                            height: auto;
                            aspect-ratio: 4 / 3;
                            object-fit: cover;
                            display: block;
                        }
                        .deck-cover-title {
                            padding: 15px 15px;
                            font-size: 32px;
                            text-align: left;
                            background: var(--background);
                            display: flex;
                            text-align: center;
                            align-items: center;
                            justify-content: center;
                            gap: 5px;
                        }
                        .deck-cover-title .mana-symbol {
                            height: 28px;
                            width: 28px;
                            vertical-align: middle;
                        }
                        .hidden {
                            display: none !important;
                        }
                        .tag-filters {
                            display: flex;
                            justify-content: center;
                            flex-wrap: wrap;
                            gap: 5px;
                            margin: 5px;
                        }
                        .tag-filters .filter-btn {
                            flex: 1 1 auto;
                            min-width: 60px;
                            margin: 0px;
                        }

                        .decklist { display: flex; flex-direction: column; gap: 5px; width: 350px; }
                        .decklist-title { font-size: 48px; font-weight: bold; margin-bottom: .2em;}
                        .decklist-title .mana-symbol { height: 1em; width: auto; padding: 0 4px;}
                        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 2px 5px; position: relative; transition: background-color 0.2s; }
                        .list-item.highlight { background-color: var(--col-body-bg-next); border-radius: 3px; }
                        .list-item .quantity { width: 30px; text-align: center; }
                        .list-item .card-name { flex-grow: 1;}
                        .card-group { margin-top: 10px; }
                        .card-group-title { margin-bottom:10px; font-size: 16px; border-bottom: 2px solid; color: var(--gray); }
                        .card-preview-container {
                            margin-left: 20px;
                            flex: 1;
                            max-width: 600px;
                            min-height: 500px;
                            overflow: hidden;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            border-radius: 15px;
                            position: sticky;
                            top: 20px;
                            align-self: flex-start;
                        
                        }
                        .card-preview-container img {
                            max-height: 100%;
                            max-width: 100%;
                            object-fit: contain;
                            opacity: 0;
                            transition: opacity 0.2s ease;
                            border-radius: 15px;
                        }
                        .card-preview-container img.instant {
                            transition: none !important;
                            opacity: 1 !important;
                        }
                        .loader {
                            border: 4px solid var(--col-body-bg);
                            border-top: 4px solid var(--col-text-code);
                            border-radius: 50%;
                            width: 40px;
                            height: 40px;
                            animation: spin 1s linear infinite;
                        }

                        @keyframes spin {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                    </style>
                    <!-- Page: Deck Selector -->
                    <div id="deck-selector-view">
                        <!-- Filter Selection -->
                        <h1>Filters</h1>
                        <div class="tag-filters">
                            <button class="filter-btn active" data-filter="all">☰ All</button>
                            <button class="filter-btn" data-filter="W"><img src="https://svgs.scryfall.io/card-symbols/W.svg" class="mana-symbol" alt="White"></button>
                            <button class="filter-btn" data-filter="U"><img src="https://svgs.scryfall.io/card-symbols/U.svg" class="mana-symbol" alt="Blue"></button>
                            <button class="filter-btn" data-filter="B"><img src="https://svgs.scryfall.io/card-symbols/B.svg" class="mana-symbol" alt="Black"></button>
                            <button class="filter-btn" data-filter="R"><img src="https://svgs.scryfall.io/card-symbols/R.svg" class="mana-symbol" alt="Red"></button>
                            <button class="filter-btn" data-filter="G"><img src="https://svgs.scryfall.io/card-symbols/G.svg" class="mana-symbol" alt="Green"></button>
                            <button class="filter-btn" data-filter="1"><img src="https://svgs.scryfall.io/card-symbols/1.svg" class="mana-symbol" alt="Colorless"></button>
                        </div>
                        <div class="tag-filters">
                            <button class="filter-btn" data-filter="aggro">🖿 Aggro</button>
                            <button class="filter-btn" data-filter="midrange">🖿 Midrange</button>
                            <button class="filter-btn" data-filter="control">🖿 Control</button>
                            <button class="filter-btn" data-filter="prison">🖿 Prison</button>
                            <button class="filter-btn" data-filter="combo">🖿 Combo</button>
                            <button class="filter-btn" data-filter="discard">🖿 Discard</button>
                            <button class="filter-btn" data-filter="tribal">🖿 Tribal</button>
                            <button class="filter-btn" data-filter="land destr.">🖿 Land Destr.</button>
                        </div>
                        <!-- Deck Selection -->
                        <h1>Decks</h1>
                        <div class="deck-selector" id="deck-selector"></div>
                    </div>
                    <!-- Page: Decklist -->
                    <div id="decklist-view" class="hidden">
                        <!-- Deck Title -->
                        <div class="decklist-title" id="deck-title"></div>
                        <!-- Left and Right Panes -->
                        <div style="display: flex;">
                            <!-- Left Side / Deck List -->
                            <div class="decklist" id="decklist"></div>
                            <!-- Right Side / Card Preview -->
                            <div class="card-preview-container" id="card-preview-container">
                                <div class="loader"></div>
                            </div>
                        </div>
                        <!-- Back Button -->
                        <button class="back-button" id="back-button" style="margin-top:50px;">↩ All Decks</button>
                    </div>
                    <!-- Deck Data -->
                    <script src="/pages/premodern/decks.js"></script>
                    <!-- Programming -->
                    <script>
                        
                        let currentDeck = null;

                        //////////
                        ////////// Mana Utilities
                        //////////

                        // Mana Text to Mana Symbol Images
                        function convertManaToImages(manaString) {
                            return manaString.replace(/{(.*?)}/g, (_, symbol) => {
                                const symbolFileName = symbol.toUpperCase();
                                return `<img src="https://svgs.scryfall.io/card-symbols/${symbolFileName}.svg" class="mana-symbol" alt="${symbol}">`;
                            });
                        }
                    
                        // Mana Text to CMC Value
                        function getManaValue(manaCost) {
                            if (!manaCost) return 0;
                        
                            let value = 0;
                            const regex = /\{(\d+)\}/g; // Match {X} for numeric mana costs
                            let match;
                        
                            while ((match = regex.exec(manaCost)) !== null) {
                                value += parseInt(match[1], 10);
                            }
                        
                            // Account for colored mana costs (add 1 for each color symbol)
                            value += (manaCost.match(/{[A-Za-z]}/g) || []).length;
                            return value;
                        }

                        //////////
                        ////////// Deck Selector Page Logic
                        //////////

                        // Executed when a deck is selected, shows the decklist view, and loads the deck details
                        async function loadDeck() {
                            // Store references to HTML elements
                            const decklist = document.getElementById("decklist");
                            const deckTitle = document.getElementById("deck-title");
                            const cardPreviewContainer = document.getElementById("card-preview-container");
                            // Deck Meta Data
                            const manaSymbols = currentDeck.colors.map(c => `<img src="https://svgs.scryfall.io/card-symbols/${c}.svg" class="mana-symbol" alt="${c}">`).join('');
                            const tagsHtml = currentDeck.tags && currentDeck.tags.length > 0 
                                ? `<div style="margin-top: 8px;">${currentDeck.tags.map(tag => `<span class="tag">${tag}</span>`).join(' ')}</div>` 
                                : '';
                            // Create HTML Deck Title
                            deckTitle.innerHTML = `${manaSymbols}&nbsp;&nbsp;${currentDeck.title}`; //${tagsHtml}
                            // Card group staging
                            let groupedCards = {
                                "Creatures": [],
                                "Enchantments": [],
                                "Artifacts": [],
                                "Sorceries": [],
                                "Instants": [],
                                "Lands": []
                            };
                            // For each card in the deck
                            for (const card of currentDeck.cards) {
                                try {
                                    // Get card details from Scryfall API
                                    let response = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card.name)}&set=${card.set}`);
                                    let data = await response.json();
                                    // Group cards by their type
                                    let cardType = data.type_line.split(" — ")[0];
                                    let groupKey = "Other";
                                    if (cardType.includes("Creature")) {
                                        groupKey = "Creatures";
                                    } else if (cardType.includes("Enchantment")) {
                                        groupKey = "Enchantments";
                                    } else if (cardType.includes("Artifact")) {
                                        groupKey = "Artifacts";
                                    } else if (cardType.includes("Sorcery")) {
                                        groupKey = "Sorceries";
                                    } else if (cardType.includes("Instant")) {
                                        groupKey = "Instants";
                                    } else if (cardType.includes("Land")) {
                                        groupKey = "Lands";
                                    }
                                    // Add the card to the appropriate group
                                    groupedCards[groupKey].push({
                                        quantity: card.quantity,
                                        name: data.name,
                                        manaCost: data.mana_cost || "",
                                        image: data.image_uris?.normal || "",
                                        manaValue: getManaValue(data.mana_cost || "")
                                    });
                                } catch (error) {
                                    console.error("Error fetching card:", card.name, error);
                                }
                            }
                            // For each card type group
                            for (const [cardType, cards] of Object.entries(groupedCards)) {
                                if (cards.length > 0) {  // Only render group if it has cards
                                    // Render group container
                                    const groupContainer = document.createElement("div");
                                    groupContainer.classList.add("card-group");
                                    // Render group title
                                    const groupTitle = document.createElement("div");
                                    groupTitle.classList.add("card-group-title");
                                    groupTitle.textContent = cardType;
                                    groupContainer.appendChild(groupTitle);
                                    // Sort cards by their mana value
                                    cards.sort((a, b) => a.manaValue - b.manaValue);
                                    // For each card in the group
                                    cards.forEach(card => {
                                        // Render card list item
                                        let listItem = document.createElement("div");
                                        listItem.classList.add("list-item");
                                        listItem.innerHTML = `
                                            <span class="quantity">${card.quantity}</span>
                                            <span class="card-name">${card.name}</span>
                                            <span>${convertManaToImages(card.manaCost)}</span>
                                            <!--<img src="${card.image}" class="card-image" data-preview="${card.image}">-->
                                        `;
                                        // Add hover event listeners for card preview
                                        listItem.addEventListener('mouseover', function() {
                                            document.querySelectorAll('.list-item').forEach(item => item.classList.remove('highlight'));
                                            this.classList.add('highlight');
                                            cardPreviewContainer.innerHTML = `<img src="${card.image}" alt="${card.name}" class="instant">`;
                                            stopAutoCardPreview();
                                        });
                                        // Add mouseout event to resume auto preview cycling
                                        listItem.addEventListener('mouseout', function() {
                                            this.classList.remove('highlight');
                                            startAutoCardPreview();
                                        });
                                        // Append the card list item to the group container
                                        groupContainer.appendChild(listItem);
                                    });
                                
                                    decklist.appendChild(groupContainer);
                                }
                            }
                            // Collect all card images for preview cycling
                            window.cardPreviewImages = currentDeck.cards.map(card => {
                                const found = groupedCards["Creatures"].concat(groupedCards["Enchantments"], groupedCards["Artifacts"], groupedCards["Sorceries"], groupedCards["Instants"], groupedCards["Lands"]).find(c => c.name === card.name);
                                return found ? { image: found.image, name: found.name } : null;
                            }).filter(Boolean);
                            startAutoCardPreview();
                        }

                        // Executed when the page loads, or when filters are changed, or when the back button is clicked
                        // Shows the deck selector view, hides the decklist view, and renders the filtered list of decks
                        async function showDeckSelector() {
                            const deckSelector = document.getElementById('deck-selector');
                            const deckSelectorView = document.getElementById('deck-selector-view');
                            const decklistView = document.getElementById('decklist-view');
                            
                            deckSelectorView.classList.remove('hidden');
                            decklistView.classList.add('hidden');
                            
                            deckSelector.innerHTML = '';
                            
                            // Get selected filter
                            const selectedFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';
                            
                            // Filter decks based on selected filter
                            const filteredDecks = all_decks.filter(deck => {
                                // If "all" is selected, show all decks
                                if (selectedFilter === 'all') return true;
                                
                                // Check if it's a tag filter (aggro, control, midrange, etc.)
                                if (deck.tags && deck.tags.includes(selectedFilter)) return true;
                                
                                // Check if it's a color filter (W, U, B, R, G, 1)
                                if (deck.colors && deck.colors.includes(selectedFilter)) return true;
                                
                                return false;
                            });
                            // For Each Deck, Fetch Thumbnail, Data, Render, and Add Click Event
                            for (const deck of filteredDecks) {
                                try {
                                    const response = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(deck.thumbnail.name)}&set=${deck.thumbnail.set}`);
                                    const data = await response.json();
                                    
                                    const deckCover = document.createElement('div');
                                    deckCover.classList.add('deck-cover');
                                    const manaSymbols = deck.colors.map(c => `<img src="https://svgs.scryfall.io/card-symbols/${c}.svg" class="mana-symbol" alt="${c}">`).join('');
                                    deckCover.innerHTML = `
                                        <img src="${data.image_uris?.art_crop || ''}" alt="${deck.title}">
                                        <div class="deck-cover-title">${manaSymbols}&nbsp;${deck.title}</div>
                                    `;
                                    deckCover.addEventListener('click', () => selectDeck(deck));
                                    deckSelector.appendChild(deckCover);
                                } catch (error) {
                                    console.error('Error fetching thumbnail for:', deck.title, error);
                                }
                            }
                        }

                        // When a deck is selected, show the decklist view and load the deck details
                        function selectDeck(deck) {
                            // Set the current deck
                            currentDeck = deck;
                            // Hide deck selector view
                            const deckSelectorView = document.getElementById('deck-selector-view');
                            deckSelectorView.classList.add('hidden');
                            // Show decklist view
                            const decklistView = document.getElementById('decklist-view');
                            decklistView.classList.remove('hidden');
                            // Clear previous decklist
                            const decklist = document.getElementById('decklist');
                            decklist.innerHTML = '';
                            // Set deck title and thumbnail
                            const deckTitle = document.getElementById('deck-title');
                            deckTitle.innerHTML = '';
                            // Show loading state in card preview
                            const cardPreviewContainer = document.getElementById('card-preview-container');
                            cardPreviewContainer.innerHTML = '<div class="loader"></div>';
                            // Stop any ongoing auto card preview
                            stopAutoCardPreview();
                            // Load the selected deck's details and render the decklist
                            loadDeck();
                        }

                        // Button Event Listener - Back
                        document.getElementById('back-button').addEventListener('click', showDeckSelector);

                        // Button Event Listener - Filters
                        document.querySelectorAll('.filter-btn').forEach(button => {
                            button.addEventListener('click', function() {
                                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                                this.classList.add('active');
                                showDeckSelector();
                            });
                        });

                        //////////
                        ////////// Card Preview Page Logic
                        //////////

                        let autoCardPreviewInterval = null;
                        let autoCardPreviewIndex = 0;

                        // Show card preview based on index, with fade effect and list item highlight
                        function showCardPreview(index) {
                            const cardPreviewContainer = document.getElementById("card-preview-container");
                            const images = window.cardPreviewImages || [];
                            // If images are available
                            if (images.length > 0) {
                                const card = images[index % images.length];
                                // Create HTML
                                cardPreviewContainer.innerHTML = `<img src="${card.image}" alt="${card.name}" style="opacity:0">`;
                                // Apply fade-in effect after image loads
                                const img = cardPreviewContainer.querySelector('img');
                                if (img) {
                                    setTimeout(() => {
                                        img.style.opacity = 1;
                                    }, 50);
                                }
                                // Highlight the corresponding card name in the list
                                document.querySelectorAll('.list-item').forEach(item => item.classList.remove('highlight'));
                                const cardNameElements = document.querySelectorAll('.card-name');
                                for (let element of cardNameElements) {
                                    if (element.textContent === card.name) {
                                        element.closest('.list-item').classList.add('highlight');
                                        break;
                                    }
                                }
                            } else {
                                // If no images are available, show a loading state or placeholder
                                cardPreviewContainer.innerHTML = `<div class="loader"></div>`;
                            }
                        }

                        // Start automatic card preview cycling
                        function startAutoCardPreview() {
                            if (autoCardPreviewInterval) return;
                            autoCardPreviewInterval = setInterval(() => {
                                autoCardPreviewIndex = (autoCardPreviewIndex + 1) % (window.cardPreviewImages?.length || 1);
                                showCardPreview(autoCardPreviewIndex);
                            }, 2000);
                        }

                        // Stop automatic card preview cycling
                        function stopAutoCardPreview() {
                            if (autoCardPreviewInterval) {
                                clearInterval(autoCardPreviewInterval);
                                autoCardPreviewInterval = null;
                            }
                        }

                        //////////
                        ////////// Start the party
                        //////////
                        showDeckSelector();

                    </script>
                </div>
            </div>
        </div>
        <script type="text/javascript" src="https://nickmuse.github.io/muse.css/toggle_dark.js"></script>
        <script type="text/javascript" src="https://nickmuse.github.io/muse.css/tabs.js"></script>
    </body>
</html>
